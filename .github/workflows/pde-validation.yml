name: PDE numerical validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/onco_dynamics_x/validation/reference_solver.py"
      - "src/onco_dynamics_x/cellular_simulation/coupling.py"
      - "tests/test_reference_solver.py"
      - "tests/test_coupling.py"
      - "scripts/run_numerical_validation.py"
      - ".github/workflows/pde-validation.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  synthetic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scientific and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,science]"

      - name: Run full test suite
        run: pytest

      - name: Lint source, tests and validation script
        run: ruff check src tests scripts/run_numerical_validation.py

      - name: Run synthetic 2D/3D numerical validation
        run: |
          python scripts/run_numerical_validation.py             --output results/numerical_validation/synthetic_pde_validation.json

      - name: Publish aggregate synthetic validation report
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-pde-numerical-validation
          path: results/numerical_validation/synthetic_pde_validation.json
          if-no-files-found: error
          retention-days: 30
