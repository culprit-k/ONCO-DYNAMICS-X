name: TCGA-BRCA open-data audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/onco_dynamics_x/data_engine/**"
      - "src/onco_dynamics_x/cli.py"
      - ".github/workflows/tcga-brca-audit.yml"

permissions:
  contents: read

jobs:
  audit-open-tcga-brca:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Query primary-tumour open TCGA-BRCA STAR-count metadata
        run: |
          mkdir -p audit-output
          onco-dynamics gdc-query \
            --project-id TCGA-BRCA \
            --data-type "Gene Expression Quantification" \
            --workflow-type "STAR - Counts" \
            --sample-type "Primary Tumor" \
            --page-size 100 \
            --max-results 100 \
            --metadata-output audit-output/gdc_open_files.csv \
            --manifest-output audit-output/gdc_sample_manifest.csv
      - name: Summarize and validate specimen selection
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          from collections import Counter
          from pathlib import Path

          with Path("audit-output/gdc_open_files.csv").open(newline="", encoding="utf-8") as handle:
              files = list(csv.DictReader(handle))
          with Path("audit-output/gdc_sample_manifest.csv").open(newline="", encoding="utf-8") as handle:
              samples = list(csv.DictReader(handle))
          sample_types = Counter(row["sample_type"] for row in samples)
          report = {
              "project": "TCGA-BRCA",
              "query": {
                  "data_type": "Gene Expression Quantification",
                  "workflow_type": "STAR - Counts",
                  "access": "open",
                  "sample_type": "Primary Tumor",
                  "max_file_records": 100,
              },
              "file_records": len(files),
              "unique_patients": len({r["patient_id"] for r in samples if r["patient_id"]}),
              "unique_samples": len({r["sample_id"] for r in samples if r["sample_id"]}),
              "sample_type_counts": dict(sample_types),
              "access_values": sorted({r["access"] for r in files}),
              "workflow_values": sorted({r["workflow_type"] for r in files}),
              "file_bytes_total": sum(int(r["file_size"]) for r in files),
              "example_files": [
                  {
                      "file_id": r["file_id"],
                      "file_name": r["file_name"],
                      "file_size": int(r["file_size"]),
                      "patient_ids": r["patient_submitter_ids"],
                      "sample_ids": r["sample_submitter_ids"],
                      "sample_types": r["sample_types"],
                  }
                  for r in files[:5]
              ],
          }
          if not files or not samples:
              raise SystemExit("GDC returned no primary-tumour files/samples.")
          if report["access_values"] != ["open"]:
              raise SystemExit("Non-open access record detected.")
          if set(sample_types) != {"Primary Tumor"}:
              raise SystemExit(f"Unexpected specimen types in primary-tumour cohort: {sample_types}")
          Path("audit-output/cohort_audit_report.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("# TCGA-BRCA primary-tumour metadata audit\n\n")
              summary.write(f"- File records: **{report['file_records']}**\n")
              summary.write(f"- Unique patients: **{report['unique_patients']}**\n")
              summary.write(f"- Unique primary-tumour samples: **{report['unique_samples']}**\n")
              summary.write(f"- Sample type counts: **{report['sample_type_counts']}**\n")
              summary.write(f"- Total selected file bytes: **{report['file_bytes_total']:,}**\n")
              summary.write("- Access class: open only\n")
              summary.write("- No expression files or participant-level clinical data were uploaded.\n")
          PY
      - name: Upload metadata-only audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcga-brca-primary-tumour-metadata-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 14
