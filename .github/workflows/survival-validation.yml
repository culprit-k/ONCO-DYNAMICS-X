name: Age-only survival validation metrics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/onco_dynamics_x/data_engine/survival_metrics.py"
      - "scripts/run_survival_validation_metrics.py"
      - "tests/test_survival_metrics.py"
      - ".github/workflows/survival-validation.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and survival dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,survival]"

      - name: Run repository tests
        run: pytest

      - name: Lint implementation and tests
        run: ruff check src tests scripts/run_survival_validation_metrics.py

      - name: Run frozen age-only TCGA-to-METABRIC evaluation
        run: |
          python scripts/run_survival_validation_metrics.py             --output results/survival_validation/age_only_external_metrics.json             --horizons-months 12 36 60             --bootstrap 250             --seed 42             --penalizer 0.1

      - name: Publish aggregate-only report
        uses: actions/upload-artifact@v4
        with:
          name: age-only-survival-validation-metrics
          path: results/survival_validation/age_only_external_metrics.json
          if-no-files-found: error
          retention-days: 30
