name: METABRIC independent cohort audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/onco_dynamics_x/data_engine/cbioportal.py"
      - "scripts/audit_cbioportal_metabric.py"
      - "tests/test_cbioportal_audit.py"
      - ".github/workflows/metabric-audit.yml"

permissions:
  contents: read

jobs:
  audit-metabric:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/test_cbioportal_audit.py
      - name: Query public cBioPortal METABRIC metadata
        run: |
          python scripts/audit_cbioportal_metabric.py \
            --output-json results/metabric_audit/report.json \
            --output-csv results/metabric_audit/clinical_attribute_coverage.csv
      - name: Publish aggregate audit report
        uses: actions/upload-artifact@v4
        with:
          name: metabric-aggregate-audit
          path: |
            results/metabric_audit/report.json
            results/metabric_audit/clinical_attribute_coverage.csv
          if-no-files-found: error
          retention-days: 14
