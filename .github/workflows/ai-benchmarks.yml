name: Synthetic PINN, FNO and GNN training benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/onco_dynamics_x/ai_engine/pinn.py"
      - "src/onco_dynamics_x/ai_engine/neural_operator.py"
      - "src/onco_dynamics_x/ai_engine/spatial_gnn.py"
      - "src/onco_dynamics_x/ai_engine/synthetic_benchmarks.py"
      - "scripts/train_synthetic_ai_benchmarks.py"
      - "tests/test_synthetic_ai_benchmarks.py"
      - ".github/workflows/ai-benchmarks.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  synthetic-ai-training:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU PyTorch and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.3" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest

      - name: Lint source, tests and training script
        run: ruff check src tests scripts/train_synthetic_ai_benchmarks.py

      - name: Train synthetic PINN and FNO benchmarks
        run: |
          python scripts/train_synthetic_ai_benchmarks.py             --output results/ai_benchmarks/synthetic_pinn_fno_training.json             --pinn-epochs 1000             --fno-epochs 120             --seed 42

      - name: Publish aggregate synthetic AI metrics
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-pinn-fno-training
          path: results/ai_benchmarks/synthetic_pinn_fno_training.json
          if-no-files-found: error
          retention-days: 30
