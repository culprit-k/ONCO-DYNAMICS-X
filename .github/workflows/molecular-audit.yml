name: Breast cancer molecular marker availability audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/onco_dynamics_x/data_engine/cbioportal.py"
      - "src/onco_dynamics_x/data_engine/molecular_audit.py"
      - "tests/test_cbioportal_audit.py"
      - "tests/test_molecular_audit.py"
      - "scripts/run_molecular_marker_audit.py"
      - ".github/workflows/molecular-audit.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  marker-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest

      - name: Lint source, tests and audit script
        run: ruff check src tests scripts/run_molecular_marker_audit.py

      - name: Query public cBioPortal expression profiles
        run: |
          python scripts/run_molecular_marker_audit.py             --output results/molecular_audit/marker_panel_overlap.json

      - name: Publish aggregate-only molecular audit
        uses: actions/upload-artifact@v4
        with:
          name: breast-cancer-molecular-marker-audit
          path: results/molecular_audit/marker_panel_overlap.json
          if-no-files-found: error
          retention-days: 30
