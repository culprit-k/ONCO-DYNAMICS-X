name: Biological calibration validation

on:
  push:
    branches: [main]
    paths:
      - "src/onco_dynamics_x/calibration/biological.py"
      - "src/onco_dynamics_x/calibration/net_volume.py"
      - "src/onco_dynamics_x/calibration/pde_parameter_estimation.py"
      - "src/onco_dynamics_x/data_engine/biological_calibration_audit.py"
      - "tests/test_biological_calibration.py"
      - "tests/test_net_volume_calibration.py"
      - "tests/test_pde_parameter_estimation.py"
      - "tests/test_biological_calibration_audit.py"
      - "scripts/fit_longitudinal_growth.py"
      - "scripts/fit_treatment_net_volume.py"
      - "scripts/audit_biological_calibration_targets.py"
      - ".github/workflows/biological-calibration-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/onco_dynamics_x/calibration/biological.py"
      - "src/onco_dynamics_x/calibration/net_volume.py"
      - "src/onco_dynamics_x/data_engine/biological_calibration_audit.py"
      - "tests/test_biological_calibration.py"
      - "tests/test_net_volume_calibration.py"
      - "tests/test_biological_calibration_audit.py"
      - "scripts/fit_longitudinal_growth.py"
      - "scripts/fit_treatment_net_volume.py"
      - "scripts/audit_biological_calibration_targets.py"
      - ".github/workflows/biological-calibration-validation.yml"

permissions:
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install science and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,science]"
      - name: Test synthetic parameter recovery
        run: pytest -q tests/test_biological_calibration.py tests/test_biological_calibration_audit.py tests/test_net_volume_calibration.py tests/test_pde_parameter_estimation.py
      - name: Lint calibration additions
        run: ruff check src/onco_dynamics_x/calibration/biological.py src/onco_dynamics_x/calibration/net_volume.py src/onco_dynamics_x/calibration/pde_parameter_estimation.py src/onco_dynamics_x/data_engine/biological_calibration_audit.py tests/test_biological_calibration.py tests/test_biological_calibration_audit.py tests/test_net_volume_calibration.py tests/test_pde_parameter_estimation.py scripts/fit_longitudinal_growth.py scripts/fit_treatment_net_volume.py scripts/audit_biological_calibration_targets.py
