[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onco-dynamics-x"
version = "0.1.0"
description = "A multiscale mathematical and AI-assisted breast-cancer research prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
dashboard = ["streamlit>=1.36", "matplotlib>=3.8", "plotly>=5.22"]
hardware = ["pyserial>=3.5"]
science = ["scipy>=1.13", "pandas>=2.2", "scikit-learn>=1.5", "statsmodels>=0.14"]
imaging = ["pydicom>=3.0", "SimpleITK>=2.4"]
survival = ["pandas>=2.2", "lifelines>=0.29"]
pinn = ["torch>=2.3"]
bayesian = ["pymc>=5.15", "arviz>=0.18"]
spatial = ["torch-geometric>=2.5"]
causal = ["dowhy>=0.12"]
control = ["casadi>=3.6"]

[project.scripts]
onco-dynamics = "onco_dynamics_x.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
